modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/RinkyDinkyNooble/the-lost-cities-wiki/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Hard dependency. Every feature patches or reads Lost Cities, so the mod is
# useless without it and must load first.
[[dependencies.${mod_id}]]
    modId="lostcities"
    mandatory=true
    versionRange="${lostcities_version_range}"
    ordering="AFTER"
    side="BOTH"
