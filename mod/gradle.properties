org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

mod_id=lostcities_devtool
mod_name=The Lost Cities - DevTool
# The 7.5 line. The suffix names the Lost Cities line, as it did at 3.0.0-7.5.
#
# A minor bump, and it does now say this build has something the 7.4.12 build
# lacks, because it does: two import fixes that were never back-ported. The rule in
# RELEASING.md about the two files carrying one feature number assumed both lines
# move together, and they no longer do.
mod_version=3.1.1-7.5
mod_group_id=com.rinkynooble.lostcitiesdevtool
mod_authors=RinkyNooble
mod_license=0BSD
mod_description=Authoring tools for The Lost Cities: earlier and more accurate fault reporting, JSON5 for Lost Cities assets, and optional repairs for traced bugs. Adds no content and changes no generation unless a repair is switched on.

minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.4.10
forge_version_range=[47,)
loader_version_range=[47,)

# The mod this one patches. The version range is deliberately narrow: a mixin is
# bound to the shape of the code it patches, so each Lost Cities version needs its
# own verification pass rather than a range bump.
#
# Note the format. Lost Cities reports its version with the Minecraft branch in
# front, as '1.20-7.5.4', so a range written as [7.5.1,7.6) never matches.
#
# The range covers 7.5.1 through 7.5.5, which was checked rather than assumed.
# Every mixin target, by exact descriptor and by call count inside the target
# method, is identical across all five. 7.5.1, 7.5.2 and 7.5.3 carry the same 327
# classes and the same 160 profile keys; 7.5.4 adds three GUI classes and one
# profile key, 'railwayLevelOffset'; 7.5.5 changes 45 classes and adds one, and
# touches nothing this mod patches.
#
# Closed at the top, rather than open to 7.6. An open bound bets that a patch
# release moves no mixin target, and 7.5.5 moved 45 classes, so the bet is not
# free. A version that does not exist yet cannot have been swept.
#
# The bound is inclusive and the comparison is numeric, which was verified rather
# than assumed: Maven's DefaultArtifactVersion parses the part after the dash as
# numbers, so 7.5.10 sorts above 7.5.5 and is correctly excluded. Compared as text
# it would have sorted below and been let in.
lostcities_version_range=[1.20-7.5.1,1.20-7.5.5]
