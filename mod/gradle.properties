org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

mod_id=lostcities_devtool
mod_name=The Lost Cities - DevTool
# A development build, not a release. The number becomes 2.0.0 at publish, once the
# work is done and the changelog is written from research/2.0.0/CHANGELOG-DRAFT.md.
# It is not left at 1.3.0 because a jar that reports the released version while
# behaving differently is indistinguishable from the real one, to a person and to
# Forge alike.
mod_version=2.0.0-dev
mod_group_id=com.rinkynooble.lostcitiesdevtool
mod_authors=RinkyNooble
mod_license=0BSD
mod_description=Authoring tools for The Lost Cities: earlier and more accurate fault reporting, JSON5 for Lost Cities assets, and optional repairs for traced bugs. Adds no content and changes no generation unless a repair is switched on.

minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.4.10
forge_version_range=[47,)
loader_version_range=[47,)

# The mod this one patches. The version range is deliberately narrow: a mixin is
# bound to the shape of the code it patches, so each Lost Cities version needs its
# own verification pass rather than a range bump.
#
# Note the format. Lost Cities reports its version with the Minecraft branch in
# front, as '1.20-7.4.12', so a range written as [7.4.12,7.5) never matches.
lostcities_version_range=[1.20-7.4.12,1.20-7.5)
