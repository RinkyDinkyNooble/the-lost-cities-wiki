site_name: Lost Cities Wiki
site_description: An in-depth, community-facing guide to building custom cities with the Lost Cities Minecraft mod.
site_url: https://rinkydinkynoble.github.io/the-lost-cities-wiki/
repo_url: https://github.com/RinkyDinkyNooble/the-lost-cities-wiki
repo_name: the-lost-cities-wiki
edit_uri: edit/main/docs/
copyright: Released under CC0 1.0. Lost Cities is by McJty; this is an unofficial guide.

theme:
  name: material
  palette:
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow
  icon:
    repo: fontawesome/brands/github

extra:
  status:
    in-progress: Still being written, more content planned

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - def_list
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.mark
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
      - How It All Connects: getting-started/how-it-connects.md
      - Your First Custom City: getting-started/first-city.md
      - Namespaces: getting-started/namespaces.md
      - The Content Model: getting-started/content-model.md
  - Reference:
      - Overview: reference/index.md
      - Profile: reference/profile.md
      - World Style: reference/worldstyle.md
      - City Style: reference/citystyle.md
      - Style: reference/style.md
      - Building: reference/building.md
      - Building Part: reference/part.md
      - Palette: reference/palette.md
      - Variant: reference/variant.md
      - Condition: reference/condition.md
      - Multi-Building: reference/multibuilding.md
      - Scattered Building: reference/scattered.md
      - Stuff Object: reference/stuff.md
      - Predefined City & Sphere: reference/predefined.md
  - Concepts:
      - Matchers: concepts/matchers.md
      - Streets, Highways, Rails & Monorails: concepts/infrastructure-parts.md
  - Under the Hood:
      - How a Chunk Becomes a City: under-the-hood/city-generation.md
      - The Generation Pipeline: under-the-hood/generation-pipeline.md
      - Damage, Ruins & Explosions: under-the-hood/damage-and-ruins.md
  - Advanced:
      - KubeJS Integration: advanced/kubejs.md
      - Command Blocks: advanced/command-blocks.md
  - Tooling:
      - Editing & Tooling: tooling/editing.md
      - Testing & Debugging Commands: tooling/commands.md
  - Troubleshooting:
      - Error Messages: troubleshooting/errors.md
      - Known Issues & Workarounds: troubleshooting/known-issues.md
  - Examples: examples/index.md
  - Glossary: glossary.md
