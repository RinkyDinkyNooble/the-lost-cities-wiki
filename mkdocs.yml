site_name: Lost Cities Wiki
site_description: An in-depth, community-facing guide to building custom cities with the Lost Cities Minecraft mod.

theme:
  name: material
  palette:
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

markdown_extensions:
  - admonition
  - def_list
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.mark
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
      - How It All Connects: getting-started/how-it-connects.md
      - Namespaces: getting-started/namespaces.md
      - The Content Model: getting-started/content-model.md
  - Reference:
      - Profile: reference/profile.md
  - Glossary: glossary.md
